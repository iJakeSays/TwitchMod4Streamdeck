<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redemption Settings</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: #d8d8d8;
        }

        .info-text {
            color: #a0a0a0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <p class="info-text">No additional configuration needed.</p>
        <p class="info-text">Press the button to fulfill, refund, or complete all channel point redemptions.</p>
    </div>

    <script>
        // Get connection info from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port') || '28196';
        const uuid = urlParams.get('propertyInspectorUUID') || urlParams.get('uuid');
        const registerEvent = urlParams.get('registerEvent') || 'registerPropertyInspector';

        let websocket;

        function connectToStreamDeck() {
            websocket = new WebSocket(`ws://127.0.0.1:${port}`);

            websocket.onopen = () => {
                websocket.send(JSON.stringify({
                    event: registerEvent,
                    uuid: uuid
                }));
            };
        }

        connectToStreamDeck();
    </script>
</body>
</html>
