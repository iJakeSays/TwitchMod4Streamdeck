<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shoutout Settings</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: #d8d8d8;
        }

        .sdpi-item {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            background: #3a3a3a;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d8d8d8;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #9147ff;
        }

        .info-text {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <label for="streamerUsername">Streamer Username:</label>
            <input type="text" id="streamerUsername" placeholder="Enter Twitch username">
            <p class="info-text">Enter the username of the streamer you want to shoutout</p>
        </div>
    </div>

    <script>
        // Get connection info from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port') || '28196';
        const uuid = urlParams.get('propertyInspectorUUID') || urlParams.get('uuid');
        const registerEvent = urlParams.get('registerEvent') || 'registerPropertyInspector';

        let websocket;
        let actionContext;

        function connectToStreamDeck() {
            websocket = new WebSocket(`ws://127.0.0.1:${port}`);

            websocket.onopen = () => {
                actionContext = uuid;

                websocket.send(JSON.stringify({
                    event: registerEvent,
                    uuid: uuid
                }));
            };

            websocket.onmessage = (evt) => {
                const data = JSON.parse(evt.data);

                if (data.event === 'didReceiveSettings') {
                    const settings = data.payload.settings || {};
                    if (settings.username) {
                        document.getElementById('streamerUsername').value = settings.username;
                    }
                }
            };
        }

        document.getElementById('streamerUsername').addEventListener('change', (e) => {
            websocket.send(JSON.stringify({
                event: 'setSettings',
                context: actionContext,
                payload: { username: e.target.value.trim() }
            }));
        });

        connectToStreamDeck();
    </script>
</body>
</html>
