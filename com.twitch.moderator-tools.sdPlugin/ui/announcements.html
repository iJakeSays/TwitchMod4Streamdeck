<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Announcement Settings</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: #d8d8d8;
        }

        .sdpi-item {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            background: #3a3a3a;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d8d8d8;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #9147ff;
        }

        .info-text {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 5px;
        }

        .color-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .color-blue { background: #3b82f6; }
        .color-purple { background: #8b5cf6; }
        .color-orange { background: #f97316; }
        .color-green { background: #22c55e; }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <label for="announcementText">
                <span class="color-indicator" id="colorIndicator"></span>
                Announcement Message:
            </label>
            <textarea id="announcementText" placeholder="Enter your announcement message"></textarea>
            <p class="info-text">This message will be sent as an announcement in chat when you press the button</p>
        </div>
    </div>

    <script>
        // Get connection info from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port') || '28196';
        const uuid = urlParams.get('propertyInspectorUUID') || urlParams.get('uuid');
        const registerEvent = urlParams.get('registerEvent') || 'registerPropertyInspector';
        const actionInfoStr = urlParams.get('actionInfo');
        const actionInfo = actionInfoStr ? JSON.parse(actionInfoStr) : null;

        let websocket;
        let actionContext;

        const colors = {
            'com.twitch.moderator-tools.announcement.blue': 'color-blue',
            'com.twitch.moderator-tools.announcement.purple': 'color-purple',
            'com.twitch.moderator-tools.announcement.orange': 'color-orange',
            'com.twitch.moderator-tools.announcement.green': 'color-green'
        };

        function connectToStreamDeck() {
            websocket = new WebSocket(`ws://127.0.0.1:${port}`);

            websocket.onopen = () => {
                actionContext = uuid;

                websocket.send(JSON.stringify({
                    event: registerEvent,
                    uuid: uuid
                }));

                // Set color indicator based on action type
                if (actionInfo && actionInfo.action) {
                    const colorClass = colors[actionInfo.action] || 'color-blue';
                    document.getElementById('colorIndicator').className = 'color-indicator ' + colorClass;
                }
            };

            websocket.onmessage = (evt) => {
                const data = JSON.parse(evt.data);

                if (data.event === 'didReceiveSettings') {
                    const settings = data.payload.settings || {};
                    if (settings.message) {
                        document.getElementById('announcementText').value = settings.message;
                    }
                }
            };
        }

        document.getElementById('announcementText').addEventListener('change', (e) => {
            websocket.send(JSON.stringify({
                event: 'setSettings',
                context: actionContext,
                payload: { message: e.target.value }
            }));
        });

        connectToStreamDeck();
    </script>
</body>
</html>
