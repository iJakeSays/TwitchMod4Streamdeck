<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat Management Settings</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: #d8d8d8;
        }

        .sdpi-item {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px;
            background: #3a3a3a;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d8d8d8;
            font-size: 14px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #9147ff;
        }

        .info-text {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" id="slowModeSettings">
            <label for="slowModeDuration">Slow Mode Duration (seconds):</label>
            <input type="number" id="slowModeDuration" min="3" max="120" value="30">
            <p class="info-text">How long users must wait between messages (3-120 seconds)</p>
        </div>
    </div>

    <script>
        const websocket = new WebSocket('ws://127.0.0.1:28196');
        let actionContext;

        websocket.onopen = () => {
            const urlParams = new URLSearchParams(window.location.search);
            actionContext = urlParams.get('context');

            const registerEvent = {
                event: 'registerPropertyInspector',
                uuid: actionContext
            };
            websocket.send(JSON.stringify(registerEvent));
        };

        websocket.onmessage = (evt) => {
            const data = JSON.parse(evt.data);

            if (data.event === 'didReceiveSettings') {
                const settings = data.payload.settings || {};
                if (settings.slowModeDuration) {
                    document.getElementById('slowModeDuration').value = settings.slowModeDuration;
                }
            }
        };

        document.getElementById('slowModeDuration').addEventListener('change', (e) => {
            const settings = {
                slowModeDuration: parseInt(e.target.value)
            };

            websocket.send(JSON.stringify({
                event: 'setSettings',
                context: actionContext,
                payload: settings
            }));
        });
    </script>
</body>
</html>
